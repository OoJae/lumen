  <path d="M50 4c11 0 18-1 26 4s11 12 15 21 6 13 3 21-10 12-17 17-12 9-21 9-15-4-23-9-16-9-19-17 0-14 3-22 7-15 14-20 8-4 19-4Z" fill="#b45309"/>
  <path d="M50 10c4.5 23 17 35.5 40 40-23 4.5-35.5 17-40 40-4.5-23-17-35.5-40-40 23-4.5 35.5-17 40-40Z" transform="translate(50 51) scale(0.46) translate(-50 -50)" fill="#7a3607" opacity="0.9"/>
</svg>
