<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lumen seal">
  <!-- "Seal this save" is a real action in the product, so the mark has a
       pressed cut: struck into a disc with a hand-cut edge, the way wax takes
       an impression rather than a print. -->
