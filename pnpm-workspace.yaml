packages:
  - "apps/*"
  - "packages/*"
  - "contracts"
# contracts joined the workspace in Wave 3 (Hardhat: ERC-7857 companion INFT).
# services/gateway remains a documented stub (no package.json) — the gateway
# still lives in apps/web/app/api.

# pnpm 11 build-script approvals. esbuild powers Vitest; sharp speeds Next image
# optimization; keccak is a wallet-stack hashing dep. The ws perf addons are optional.
allowBuilds:
  blake-hash: true
  bufferutil: false
  es5-ext: false # storage-SDK transitive; its postinstall is a non-essential message script
  esbuild: true
  keccak: true
  onnxruntime-node: false # transformers.js transitive; we use the browser/WASM backend only
  protobufjs: false # transformers.js transitive; postinstall not needed
  secp256k1: true # hardhat toolchain native signing addon
  sharp: true
  unrs-resolver: true # native path resolver for eslint's import rules
  utf-8-validate: false
